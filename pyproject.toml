[project]
name = "adaptive-motion-control"
version = "0.1.0"
description = "Motion control for a robot arm whose payload, friction and actuators change in operation, with a learned dynamics model that adapts online."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abdirazak Mubarak" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mujoco>=3.11,<4",
    "onnxruntime",
    "matplotlib",
]

[project.optional-dependencies]
training = ["torch", "onnx", "onnxscript", "gymnasium>=1.3,<2", "stable-baselines3"]
test = ["pytest"]
